[tool.poetry]
name = "flextag"
version = "0.4.0"
description = "A lightweight markup language for structured content with powerful section-based organization, metadata filtering, and validation capabilities."
authors = ["DarrenHaba <darrenhaba@live.com>"]
readme = "README.md"
exclude = ["demo", "dev"]
packages = [{ include = "flextag", from = "src" }]
license = "MIT"

[tool.poetry.urls]
"Homepage" = "https://github.com/DarrenHaba/flextag"
"Repository" = "https://github.com/DarrenHaba/flextag"
"Bug Tracker" = "https://github.com/DarrenHaba/flextag/issues"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
tomli = { version = "^2.1.0", python = "<3.11" }
pyyaml = "^6.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
ruff = "^0.9.0"
pre-commit = "^4.0.1"
nox = "^2024.4.15"
openai = "^1.52.2"
notebook = "^7.2.2"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter, but we're not using it)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "C4"]  # Less strict for tests

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
