[tool.poetry]
name = "flextag"
version = "0.4.0a1"
description = "A lightweight markup language for structured content with powerful section-based organization, metadata filtering, and validation capabilities."
authors = ["DarrenHaba <darrenhaba@live.com>"]
readme = "README.md"
exclude = ["demo", "dev"]
packages = [{ include = "flextag", from = "src" }]
license = "MIT"

[tool.poetry.urls]
"Homepage" = "https://github.com/DarrenHaba/flextag"
"Repository" = "https://github.com/DarrenHaba/flextag"
"Bug Tracker" = "https://github.com/DarrenHaba/flextag/issues"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
tomli = { version = "^2.1.0", python = "<3.11" }
pyyaml = "^6.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
black = "^24.10.0"
flake8 = "^7.1.1"
flake8-docstrings = "^1.7.0"
pre-commit = "^4.0.1"
nox = "^2024.4.15"
openai = "^1.52.2"
notebook = "^7.2.2"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
